<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ローカル株分析ボード | ランキングチャート一覧</title>
    <script>
      (function () {
        var host = window.location.hostname || "";
        var port = window.location.port || "";
        var protocol = window.location.protocol || "";
        var path = window.location.pathname || "/";
        if (protocol === "file:" || ((host === "127.0.0.1" || host === "localhost") && port === "")) {
          var decoded = "";
          try {
            decoded = decodeURIComponent(path || "");
          } catch (_) {
            decoded = path || "";
          }
          var marker = "/kabu_doragon/";
          var markerIndex = decoded.indexOf(marker);
          var nextPath = markerIndex >= 0 ? "/" + decoded.slice(markerIndex + marker.length).replace(/^\/+/, "") : path === "/" ? "/index.html" : path;
          var nextUrl = "http://127.0.0.1:8010" + nextPath + (window.location.search || "") + (window.location.hash || "");
          window.location.replace(nextUrl);
        }
      })();
    </script>
    <script src="./assets/desktop_bootstrap.js?v=1.4.82"></script>
    <link rel="stylesheet" href="./assets/style.css?v=1.4.124" />
    <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
  </head>
  <body data-page="index-scanner">
    <main class="container">
      <header class="page-header">
        <div id="indexStickyBar" class="index-sticky-bar" aria-label="Primary controls">
          <div class="index-sticky-bar-inner">
            <span id="indexUpdatedStatus" class="index-header-status">Updated --</span>
            <div class="index-sticky-date-wrap">
              <button id="indexStickyDateButton" class="text-button index-sticky-action" type="button" aria-expanded="false">Date</button>
              <div id="indexStickyDatePopover" class="index-sticky-date-popover" hidden>
                <div class="index-sticky-section-title">Date</div>
                <div id="indexStickyMiniCalendar" class="date-calendar-wrap index-sticky-calendar"></div>
              </div>
            </div>
            <div class="index-timeframe-popover-wrap">
              <div id="indexTimeframe" class="button-group index-sticky-timeframe" role="group" aria-label="Timeframe">
                <button type="button" class="group-btn" data-value="daily">D</button>
                <button type="button" class="group-btn" data-value="weekly">W</button>
                <button type="button" class="group-btn" data-value="monthly">M</button>
              </div>
              <div id="indexTimeframePopover" class="index-timeframe-popover" hidden>
                <div id="indexTimeframePopoverTitle" class="index-timeframe-popover-title">Range</div>
                <div id="indexTimeframeOptions" class="index-timeframe-options"></div>
              </div>
            </div>
            <select id="indexSort" class="index-sticky-select" aria-label="Sort">
              <option value="">ストラテジー</option>
              <option value="strategy_minervini">成長ブレイク（Minervini）</option>
              <option value="strategy_stage2">中期上昇入り（Stage 2）</option>
              <option value="strategy_turtle">高値ブレイク（Turtle）</option>
              <option value="strategy_rsi2">上昇中の押し目（RSI(2)）</option>
              <option value="trend_turn">75日線回復（ベース・リカバリー）</option>
              <option value="strategy_high_pullback_30">高値調整（30% Pullback）</option>
            </select>
            <span id="indexRankingLabel" class="index-sticky-label index-sticky-ranking-label" hidden>ランキング</span>
            <select id="indexExtraFilter" class="index-sticky-select index-sticky-extra-filter" aria-label="ランキング">
              <option value="" selected>ランキング</option>
            </select>
            <select id="indexLimit" class="index-sticky-select index-sticky-limit" aria-label="Rows">
              <option value="">表示件数</option>
              <option value="50">50</option>
              <option value="100">100</option>
              <option value="200" selected>200</option>
            </select>
            <div class="index-sticky-turnover-wrap" aria-label="売買代金フィルター">
              <select id="indexStickyTurnover" class="index-sticky-select index-sticky-turnover" aria-label="売買代金">
                <option value="0">売買代金</option>
                <option value="50000000">5,000万円以上</option>
                <option value="100000000">1億円以上</option>
                <option value="500000000">5億円以上</option>
                <option value="1000000000" selected>10億円以上</option>
              </select>
              <div class="index-hidden-filters" hidden>
                <select id="indexStickyTag"><option value="">すべて</option></select>
                <select id="indexStickyTheme"><option value="">すべて</option></select>
                <select id="indexStickyStrategy"><option value="">すべて</option></select>
              </div>
            </div>
            <div class="index-right-actions">
              <div class="index-picked-split">
                <button id="indexPickedLink" class="action-button secondary scanner-picked-link index-sticky-action index-picked-main" type="button" aria-label="List menu" aria-expanded="false">List</button>
                <div id="indexPicksMenu" class="index-picked-menu" hidden>
                  <button id="indexAddCodesButton" class="index-picked-menu-item" type="button">コードを追加</button>
                  <button id="indexExportTradingViewButton" class="index-picked-menu-item" type="button">TradingView TXT</button>
                  <button id="indexExportHyperButton" class="index-picked-menu-item" type="button">HYPER SBI 2 CSV</button>
                  <button id="indexSaveListButton" class="index-picked-menu-item" type="button">Listを保存</button>
                  <button id="indexOpenListButton" class="index-picked-menu-item" type="button">保存Listを開く</button>
                  <button id="indexExitListButton" class="index-picked-menu-item" type="button">通常表示へ戻す</button>
                  <button id="indexSelectAllButton" class="index-picked-menu-item index-picked-menu-item--selectall" type="button">Select All</button>
                  <button id="indexResetPicksButton" class="index-picked-menu-item index-picked-menu-item--clear" type="button">Clear</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </header>

      <section class="panel">
        <div id="indexError" class="status-box error" hidden></div>
        <div id="indexDataQualitySummary" class="index-data-quality-summary" hidden></div>
        <div id="indexList" class="scanner-list index-scanner-list"></div>
      </section>
    </main>

    <div id="indexCustomCodeModal" class="index-custom-code-modal" hidden>
      <div class="index-custom-code-dialog" role="dialog" aria-modal="true" aria-labelledby="indexCustomCodeTitle">
        <div class="index-custom-code-header">
          <div>
            <div id="indexCustomCodeTitle" class="index-custom-code-title">コードをListに追加</div>
            <div class="index-custom-code-subtitle">銘柄コードをスペース・改行・カンマ区切りで貼り付け</div>
          </div>
          <button id="indexCustomCodeClose" class="index-custom-code-icon-button" type="button" aria-label="閉じる">×</button>
        </div>
        <textarea id="indexCustomCodeInput" class="index-custom-code-input" rows="8" placeholder="7203 9984 7011&#10;8306,6758"></textarea>
        <div id="indexCustomCodeMeta" class="index-custom-code-meta">0件</div>
        <div class="index-custom-code-actions">
          <button id="indexCustomCodeClear" class="index-custom-code-button secondary" type="button">クリア</button>
          <button id="indexCustomCodeExit" class="index-custom-code-button secondary" type="button">通常表示へ戻す</button>
          <button id="indexCustomCodeCancel" class="index-custom-code-button secondary" type="button">キャンセル</button>
          <button id="indexCustomCodeApply" class="index-custom-code-button primary" type="button">Listに追加</button>
        </div>
      </div>
    </div>

    <div id="indexListSaveModal" class="register-name-modal is-hidden" hidden>
      <div class="register-name-dialog" role="dialog" aria-modal="true" aria-labelledby="indexListSaveTitle">
        <h2 id="indexListSaveTitle">Listを保存</h2>
        <p class="subtle register-name-note">現在のListを重複なしで保存します。</p>
        <label class="register-name-field">
          <span>保存名</span>
          <input id="indexListSaveInput" type="text" maxlength="80" placeholder="例: 5月ブレイク候補" />
        </label>
        <div id="indexListSaveError" class="register-name-error" hidden></div>
        <div class="register-name-actions">
          <button id="indexListSaveOk" class="action-button" type="button">保存</button>
          <button id="indexListSaveCancel" class="action-button secondary" type="button">キャンセル</button>
        </div>
      </div>
    </div>

    <div id="indexListSetsModal" class="index-custom-code-modal" hidden>
      <div class="index-custom-code-dialog index-list-sets-dialog" role="dialog" aria-modal="true" aria-labelledby="indexListSetsTitle">
        <div class="index-custom-code-header">
          <div>
            <div id="indexListSetsTitle" class="index-custom-code-title">保存Listを開く</div>
            <div class="index-custom-code-subtitle">開いたListだけを値上がり率順で表示します</div>
          </div>
          <button id="indexListSetsClose" class="index-custom-code-icon-button" type="button" aria-label="閉じる">×</button>
        </div>
        <div id="indexListSetsBody" class="index-list-sets-body"></div>
      </div>
    </div>

    <script src="./assets/app_config.js?v=1.4.111"></script>
    <script src="./assets/app_utils.js?v=1.4.85"></script>
    <script src="./assets/app_data.js?v=1.4.105"></script>
    <script src="./assets/page_index_scanner_status.js?v=1.4.85"></script>
    <script src="./assets/page_index_scanner.js?v=1.4.145"></script>
    <script src="./assets/app.js?v=1.4.121"></script>
  </body>
</html>
