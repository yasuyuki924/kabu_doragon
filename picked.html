<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ローカル株分析ボード | List</title>
    <script>
      (function () {
        var host = window.location.hostname || "";
        var port = window.location.port || "";
        var protocol = window.location.protocol || "";
        var path = window.location.pathname || "/";
        if (protocol === "file:" || ((host === "127.0.0.1" || host === "localhost") && port === "")) {
          var decoded = "";
          try {
            decoded = decodeURIComponent(path || "");
          } catch (_) {
            decoded = path || "";
          }
          var marker = "/kabu_doragon/";
          var markerIndex = decoded.indexOf(marker);
          var nextPath = markerIndex >= 0 ? "/" + decoded.slice(markerIndex + marker.length).replace(/^\/+/, "") : path === "/" ? "/index.html" : path;
          var nextUrl = "http://127.0.0.1:8010" + nextPath + (window.location.search || "") + (window.location.hash || "");
          window.location.replace(nextUrl);
        }
      })();
    </script>
    <script src="./assets/desktop_bootstrap.js?v=1.4.82"></script>
    <link rel="stylesheet" href="./assets/style.css?v=1.4.169" />
    <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
  </head>
  <body data-page="picked">
    <main class="container">
      <header class="page-header">
        <div class="picked-header-toolbar">
          <a class="action-button secondary picked-header-action" href="./index.html">Back</a>
          <span class="picked-header-title">List</span>
          <span id="pickedCountBadge" class="picked-kpi-badge">Count 0</span>
          <span id="pickedSetsBadge" class="picked-kpi-badge">Sets 0</span>
          <span id="pickedUpdatedBadge" class="picked-kpi-badge picked-kpi-badge--muted">Updated --</span>
        </div>
        <div class="picked-header-actions">
          <button id="pickedHeaderExportButton" class="action-button secondary picked-header-action" type="button">Export</button>
          <button id="pickedHeaderSaveButton" class="action-button picked-header-action" type="button">Save List</button>
        </div>
      </header>

      <section class="panel">
        <div class="picked-actions-grid">
          <section id="pickedExportPanel" class="picked-action-panel">
            <div class="picked-action-panel-head">
              <h2>Export</h2>
            </div>
            <p id="pickedExportMessage" class="subtle picked-export-note"></p>
            <div class="picked-export-actions">
              <button id="pickedExportTradingViewButton" class="action-button" type="button">TradingView TXT</button>
              <button id="pickedExportHyperButton" class="action-button secondary" type="button">HYPER SBI 2 CSV</button>
            </div>
            <div id="pickedExportList" class="picked-export-list"></div>
          </section>
          <section id="pickedRegisterPanel" class="picked-action-panel picked-action-panel--saved">
            <div class="picked-action-panel-head">
              <h2>Saved Lists</h2>
              <span id="pickedRegisterCount" class="picked-action-count">0</span>
            </div>
            <div class="picked-register-actions">
              <button id="pickedRegisterAllButton" class="action-button secondary" type="button">Save Current</button>
            </div>
            <div id="pickedRegisterList" class="picked-register-list"></div>
          </section>
        </div>
        <div id="pickedError" class="status-box error" hidden></div>
        <div id="pickedChartList" class="scanner-list picked-chart-list"></div>
        <div class="table-wrap picked-table-wrap" hidden>
          <table>
            <thead>
              <tr>
                <th>Code</th>
                <th>Name</th>
                <th>Market</th>
                <th>Picked At</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="pickedTableBody">
              <tr>
                <td colspan="5" class="empty-cell">読み込み中...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <div id="registerNameModal" class="register-name-modal is-hidden" hidden>
      <div class="register-name-dialog" role="dialog" aria-modal="true" aria-labelledby="registerNameTitle">
        <h2 id="registerNameTitle">登録名を入力</h2>
        <p class="subtle register-name-note">保存名は「日付 + 入力名」で作成します。</p>
        <label class="register-name-field">
          <span>登録名</span>
          <input id="registerNameInput" type="text" maxlength="80" placeholder="例: 下ひげ監視A" />
        </label>
        <div id="registerNameError" class="register-name-error" hidden></div>
        <div class="register-name-actions">
          <button id="registerNameOkButton" class="action-button" type="button">OK</button>
          <button id="registerNameCancelButton" class="action-button secondary" type="button">キャンセル</button>
        </div>
      </div>
    </div>

    <script src="./assets/app_config.js?v=1.4.81"></script>
    <script src="./assets/app_utils.js?v=1.4.81"></script>
    <script src="./assets/app_data.js?v=1.4.100"></script>
    <script src="./assets/page_picked.js?v=1.4.99"></script>
    <script src="./assets/app.js?v=1.4.169"></script>
  </body>
</html>
