name: Deploy KabuDragon Pages

on:
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Refresh public JSON from J-Quants before deploying"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "30 8 * * 1-5"
  push:
    branches:
      - main
      - master
      - feature/lightweight-ticker-detail
    paths:
      - ".github/workflows/pages.yml"
      - "assets/**"
      - "index.html"
      - "ticker.html"
      - "picked.html"
      - "registered.html"
      - "scripts/**"
      - "src/**"
      - "requirements.txt"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      JQUANTS_PLAN: light
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Rebuild public JSON from J-Quants
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.refresh_data == true }}
        run: python scripts/run_pages_jquants_update.py --recent-days 45 --history-days 430

      - name: Build Pages artifact
        run: python scripts/build_pages_site.py --recent-days 430

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
