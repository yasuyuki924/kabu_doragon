name: Deploy KabuDragon Pages

on:
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Refresh public JSON from J-Quants before deploying"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "30 8 * * 1-5"
  push:
    branches:
      - main
      - master
      - feature/lightweight-ticker-detail
    paths:
      - ".github/workflows/pages.yml"
      - "assets/**"
      - "index.html"
      - "ticker.html"
      - "picked.html"
      - "registered.html"
      - "scripts/**"
      - "src/**"
      - "requirements.txt"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      JQUANTS_PLAN: light
      REFRESH_PUBLIC_DATA: ${{ github.event_name == 'schedule' || inputs.refresh_data == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore generated public data cache
        id: generated-data-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/ohlcv
            data/ohlcv_raw
            data/public_json
            data/manifest.json
            data/update_health.json
            data/update_summary.json
            data/update_state.json
            data/jquants_sync_state.json
            data/tse_listed_components.csv
            data/watchlist.json
            data/inactive_codes.json
          key: kabu-pages-data-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            kabu-pages-data-${{ runner.os }}-${{ github.ref_name }}-
            kabu-pages-data-${{ runner.os }}-

      - name: Inspect generated public data cache
        id: public-data-state
        shell: bash
        run: |
          if compgen -G "data/ohlcv/*.csv" > /dev/null && compgen -G "data/public_json/ticker_meta/*.json" > /dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild public JSON from J-Quants
        if: ${{ env.REFRESH_PUBLIC_DATA == 'true' || steps.public-data-state.outputs.available != 'true' }}
        run: python scripts/run_pages_jquants_update.py --recent-days 430 --history-days 430

      - name: Rebuild public JSON from cached data
        if: ${{ env.REFRESH_PUBLIC_DATA != 'true' && steps.public-data-state.outputs.available == 'true' }}
        run: python scripts/rebuild_pages_public_json_from_existing.py --recent-days 430

      - name: Save generated public data cache
        if: ${{ success() }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/ohlcv
            data/ohlcv_raw
            data/public_json
            data/manifest.json
            data/update_health.json
            data/update_summary.json
            data/update_state.json
            data/jquants_sync_state.json
            data/tse_listed_components.csv
            data/watchlist.json
            data/inactive_codes.json
          key: kabu-pages-data-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Build Pages artifact
        run: python scripts/build_pages_site.py --recent-days 430

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
