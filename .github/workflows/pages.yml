name: Deploy KabuDragon Pages

on:
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Refresh public JSON from J-Quants before deploying"
        required: false
        default: false
        type: boolean
      export_legacy_cache:
        description: "Read-only cache export for isolated verification; never deploys"
        required: false
        default: false
        type: boolean
      export_cache_key:
        description: "Exact successful main cache key for read-only export"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "53 6 * * 1-5"
    - cron: "23 7 * * 1-5"
    - cron: "53 7 * * 1-5"
    - cron: "23 8 * * 1-5"
    - cron: "45 8 * * 1-5"
    - cron: "05 9 * * 1-5"
    - cron: "25 9 * * 1-5"
    - cron: "45 9 * * 1-5"
    - cron: "05 10 * * 1-5"
    - cron: "25 10 * * 1-5"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "assets/**"
      - "index.html"
      - "ticker.html"
      - "picked.html"
      - "registered.html"
      - "scripts/**"
      - "src/**"
      - "requirements.txt"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.export_legacy_cache == true && format('split-cache-export-{0}', github.run_id) || 'pages' }}
  cancel-in-progress: true

jobs:
  export-cache:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.export_legacy_cache == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout export helper only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/export_public_cache_snapshot.py
            scripts/september_split_targets.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Validate exact source key
        env:
          SOURCE_CACHE_KEY: ${{ inputs.export_cache_key }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"kabu-pages-data-Linux-main-[0-9]+", os.environ["SOURCE_CACHE_KEY"]), "An exact main data-cache key is required"'

      - name: Restore exact legacy cache read-only
        id: export-source
        uses: actions/cache/restore@v4
        with:
          path: |
            data/ohlcv
            data/ohlcv_raw
            data/public_json
            data/manifest.json
            data/update_health.json
            data/update_summary.json
            data/update_state.json
            data/jquants_sync_state.json
            data/tse_listed_components.csv
            data/watchlist.json
            data/inactive_codes.json
          key: ${{ inputs.export_cache_key }}
          fail-on-cache-miss: true

      - name: Package immutable source without price writes
        env:
          SOURCE_CACHE_KEY: ${{ inputs.export_cache_key }}
          MATCHED_CACHE_KEY: ${{ steps.export-source.outputs.cache-matched-key }}
        run: |
          python3 scripts/export_public_cache_snapshot.py --data-dir data --output-dir "$RUNNER_TEMP/split-cache-export" --scope-file scripts/september_split_targets.json

      - name: Upload read-only snapshot for isolated verification
        uses: actions/upload-artifact@v4
        with:
          name: split-cache-source-${{ github.run_id }}
          path: ${{ runner.temp }}/split-cache-export/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  build:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.export_legacy_cache == true) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      JQUANTS_PLAN: light
      REFRESH_PUBLIC_DATA: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data == true) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            assets
            scripts
            src
            index.html
            ticker.html
            picked.html
            registered.html
            requirements.txt
            AGENTS.md
            CLAUDE.md
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore generated public data cache
        id: generated-data-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/ohlcv
            data/ohlcv_raw
            data/corporate_actions
            data/split_adjustment_state.json
            data/public_json
            data/manifest.json
            data/update_health.json
            data/update_summary.json
            data/update_state.json
            data/jquants_sync_state.json
            data/tse_listed_components.csv
            data/watchlist.json
            data/inactive_codes.json
          key: kabu-pages-split-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            kabu-pages-split-v1-${{ runner.os }}-${{ github.ref_name }}-

      - name: Restore legacy data for explicit migration only
        if: ${{ steps.generated-data-cache.outputs.cache-matched-key == '' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            data/ohlcv
            data/ohlcv_raw
            data/public_json
            data/manifest.json
            data/update_health.json
            data/update_summary.json
            data/update_state.json
            data/jquants_sync_state.json
            data/tse_listed_components.csv
            data/watchlist.json
            data/inactive_codes.json
          key: kabu-pages-legacy-readonly-${{ github.run_id }}
          restore-keys: |
            kabu-pages-data-${{ runner.os }}-${{ github.ref_name }}-

      - name: Inspect generated public data cache
        id: public-data-state
        shell: bash
        run: |
          if compgen -G "data/ohlcv/*.csv" > /dev/null && compgen -G "data/public_json/ticker_meta/*.json" > /dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine public data rebuild scope
        id: rebuild-scope
        shell: bash
        run: |
          needs_rebuild=false
          if [[ "${{ github.event_name }}" != "push" ]]; then
            if [[ "${REFRESH_PUBLIC_DATA}" == "true" ]]; then
              needs_rebuild=true
            fi
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
            if [[ -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
              needs_rebuild=true
            else
              changed_files="$(git diff --name-only "$base_sha" "$head_sha" || true)"
              if echo "$changed_files" | grep -E '^(scripts/rebuild_pages_public_json_from_existing.py|scripts/run_pages_jquants_update.py|scripts/build_lightweight_detail_public_json.py|scripts/build_period_overview_lite.py|src/|requirements\.txt)' > /dev/null; then
                needs_rebuild=true
              fi
            fi
          fi
          echo "needs_rebuild=$needs_rebuild" >> "$GITHUB_OUTPUT"

      - name: Validate restored split metadata before any data writes
        if: ${{ steps.public-data-state.outputs.available == 'true' }}
        run: |
          python scripts/check_split_adjustment.py --scope-file scripts/september_split_targets.json --require-state --public
          python scripts/check_ohlcv_integrity.py --check-raw

      - name: Incremental public JSON from J-Quants
        if: ${{ env.REFRESH_PUBLIC_DATA == 'true' && steps.public-data-state.outputs.available == 'true' }}
        run: python scripts/incremental_jquants_update.py

      - name: Rebuild public JSON from J-Quants
        if: ${{ steps.public-data-state.outputs.available != 'true' }}
        run: python scripts/run_pages_jquants_update.py --recent-days 430 --history-days 430

      - name: Rebuild public JSON from cached data
        if: ${{ env.REFRESH_PUBLIC_DATA != 'true' && steps.public-data-state.outputs.available == 'true' && steps.rebuild-scope.outputs.needs_rebuild == 'true' }}
        run: python scripts/rebuild_pages_public_json_from_existing.py --recent-days 430

      - name: Validate and seal candidate before cache save or publication
        shell: bash
        run: |
          python scripts/check_ohlcv_integrity.py --check-raw
          if [[ "${{ steps.public-data-state.outputs.available }}" == "true" ]]; then
            python scripts/check_split_adjustment.py --scope-file scripts/september_split_targets.json --public --seal
          else
            python scripts/check_split_adjustment.py --scope-file scripts/september_split_targets.json --public --seal --bootstrap-inventory .tmp/split-bootstrap/action_inventory.json
          fi

      - name: Save generated public data cache
        if: ${{ success() && (env.REFRESH_PUBLIC_DATA == 'true' || steps.public-data-state.outputs.available != 'true' || steps.rebuild-scope.outputs.needs_rebuild == 'true') }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/ohlcv
            data/ohlcv_raw
            data/corporate_actions
            data/split_adjustment_state.json
            data/public_json
            data/manifest.json
            data/update_health.json
            data/update_summary.json
            data/update_state.json
            data/jquants_sync_state.json
            data/tse_listed_components.csv
            data/watchlist.json
            data/inactive_codes.json
          key: kabu-pages-split-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Build Pages artifact
        run: python scripts/build_pages_site.py --recent-days 430

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed public data
        run: python scripts/check_public_pages_data.py --base-url "${{ steps.deployment.outputs.page_url }}" --expected-data-dir data --retries 12 --sleep 10
