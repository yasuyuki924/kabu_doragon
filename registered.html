<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ローカル株分析ボード | 登録セット</title>
    <script>
      (function () {
        var host = window.location.hostname || "";
        var port = window.location.port || "";
        var protocol = window.location.protocol || "";
        var path = window.location.pathname || "/";
        if (protocol === "file:" || ((host === "127.0.0.1" || host === "localhost") && port === "")) {
          var decoded = "";
          try {
            decoded = decodeURIComponent(path || "");
          } catch (_) {
            decoded = path || "";
          }
          var marker = "/kabu_doragon/";
          var markerIndex = decoded.indexOf(marker);
          var nextPath = markerIndex >= 0 ? "/" + decoded.slice(markerIndex + marker.length).replace(/^\/+/, "") : path === "/" ? "/index.html" : path;
          var nextUrl = "http://127.0.0.1:8010" + nextPath + (window.location.search || "") + (window.location.hash || "");
          window.location.replace(nextUrl);
        }
      })();
    </script>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var explicitVersion = params.get("v") || params.get("ts") || "";
        window.KABU_ASSET_CACHE_KEY = encodeURIComponent(explicitVersion || String(Date.now()));
        document.write('<script src="./assets/desktop_bootstrap.js?v=' + window.KABU_ASSET_CACHE_KEY + '"><' + '/script>');
        document.write('<link rel="stylesheet" href="./assets/style.css?v=' + window.KABU_ASSET_CACHE_KEY + '" />');
      })();
    </script>
    <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
  </head>
  <body data-page="registered">
    <main class="container">
      <header class="page-header">
        <div>
          <p class="eyebrow"><a href="./picked.html">← 選別一覧に戻る</a></p>
          <h1 id="registeredTitle">登録セット</h1>
          <p id="registeredMeta" class="subtle">読み込み中...</p>
        </div>
      </header>

      <section class="panel">
        <section class="picked-export-panel">
          <div class="section-head">
            <h2>ダウンロード</h2>
          </div>
          <p id="registeredExportMessage" class="subtle picked-export-note"></p>
          <div class="picked-export-actions">
            <button id="registeredExportTradingViewButton" class="action-button" type="button">TradingView用を作成</button>
            <button id="registeredExportHyperButton" class="action-button secondary" type="button">HYPER SBI 2用CSVを作成</button>
          </div>
          <div id="registeredExportList" class="picked-export-list"></div>
        </section>
        <div id="registeredError" class="status-box error" hidden></div>
        <div id="registeredChartList" class="scanner-list picked-chart-list"></div>
        <div class="table-wrap picked-table-wrap">
          <table>
            <thead>
              <tr>
                <th>コード</th>
                <th>銘柄名</th>
                <th>市場</th>
                <th>選別日時</th>
              </tr>
            </thead>
            <tbody id="registeredTableBody">
              <tr>
                <td colspan="4" class="empty-cell">読み込み中...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script>
      (() => {
        const cacheKey = window.KABU_ASSET_CACHE_KEY || String(Date.now());
        const scripts = [
          "./assets/app_config.js",
          "./assets/app_utils.js",
          "./assets/app_data.js",
          "./assets/page_registered_state.js",
          "./assets/page_registered_render.js",
          "./assets/page_registered_events.js",
          "./assets/page_registered_chart.js",
          "./assets/page_registered.js",
          "./assets/app.js",
        ];
        document.write(scripts.map((src) => `<script src="${src}?v=${cacheKey}"><` + `/script>`).join(""));
      })();
    </script>
  </body>
</html>
